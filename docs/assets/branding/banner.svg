<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="155" viewBox="0 0 1120 155" role="img" aria-labelledby="title desc">
  <title id="title">Homelab: self-hosted Kubernetes and GitOps automation</title>
  <desc id="desc">A static, transparent title banner for a self-hosted Kubernetes project automated with GitOps.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-anchor:middle}
    .title{font-size:64px;font-weight:750;letter-spacing:-2px;fill:#dceaff}
    .subtitle{font-size:30px;font-weight:500;fill:#b8cce4}
    .highlight{fill:#91dacd}
    @media(prefers-color-scheme:light){.title{fill:#18324d}.subtitle{fill:#34536f}.highlight{fill:#176e62}}
  </style>
  <text x="560" y="75" class="title">Homelab</text>
  <text x="560" y="125" class="subtitle">Self-hosted Kubernetes. <tspan class="highlight">Automated with GitOps.</tspan></text>
</svg>
