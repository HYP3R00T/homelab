<text class="label" x="619" y="141">Workstation / operator</text>
<text class="body" x="619" y="169">Browser: local hosts-file mappings</text>
<text class="body" x="619" y="192">CLI: Vault bootstrap + Terraform configuration</text>
<rect x="60" y="325" width="1000" height="110" rx="12" fill="#142237" stroke="#7cb5ff" stroke-opacity=".6"/>
<rect x="61" y="340" width="3" height="80" rx="1.5" fill="#7cb5ff"/>
<text class="label" x="79" y="356">K3s baseline · packaged ownership</text>
<text class="body" x="79" y="384">CoreDNS · Traefik + ServiceLB · Local Path Provisioner · Metrics Server</text>
<text class="body" x="79" y="407">No duplicate ingress, load balancer, storage provisioner, or live metrics server</text>
<rect x="60" y="480" width="470" height="115" rx="12" fill="#142237" stroke="#7cb5ff" stroke-opacity=".6"/>
<rect x="61" y="495" width="3" height="85" rx="1.5" fill="#7cb5ff"/>
<text class="label" x="79" y="511">Flux + embedded status UI</text>
<text class="body" x="79" y="539">Reconcile Applications and Infrastructure</text>
<text class="body" x="79" y="562">Readiness gates for secrets and monitoring</text>
<rect x="590" y="480" width="470" height="115" rx="12" fill="#142237" stroke="#68dfcd" stroke-opacity=".6"/>
<rect x="591" y="495" width="3" height="85" rx="1.5" fill="#68dfcd"/>
<text class="label" x="609" y="511">Applications</text>
<text class="body" x="609" y="539">Homepage: dashboard + current resource readings</text>
<text class="body" x="609" y="562">Linkding: personal bookmarks + owner account</text>
<rect x="60" y="655" width="470" height="115" rx="12" fill="#142237" stroke="#b7a1ff" stroke-opacity=".6"/>
<rect x="61" y="670" width="3" height="85" rx="1.5" fill="#b7a1ff"/>
<text class="label" x="79" y="686">Secret infrastructure</text>
<text class="body" x="79" y="714">Vault → External Secrets → Kubernetes Secrets</text>
<text class="body" x="79" y="737">Manual initialization, unseal, auth, and values</text>
<rect x="590" y="655" width="470" height="115" rx="12" fill="#142237" stroke="#b7a1ff" stroke-opacity=".6"/>
<rect x="591" y="670" width="3" height="85" rx="1.5" fill="#b7a1ff"/>
<text class="label" x="609" y="686">Monitoring infrastructure</text>
<text class="body" x="609" y="714">Prometheus · Grafana · Alertmanager + collectors</text>
<text class="body" x="609" y="737">Included; waits for secret-store and credentials</text>
<rect x="60" y="830" width="1000" height="115" rx="12" fill="#142237" stroke="#eac17a" stroke-opacity=".6"/>
<rect x="61" y="845" width="3" height="85" rx="1.5" fill="#eac17a"/>
<text class="label" x="79" y="861">Node-local persistent storage</text>
<text class="body" x="79" y="889">Vault + monitoring: local-path-retain · Existing Linkding claim: original local-path</text>
<text class="body" x="79" y="912">Retain preserves released PV data; independent backups are still required</text>
<rect x="60" y="1078" width="1000" height="58" rx="12" fill="#142237" stroke="#9bacc4" stroke-opacity=".6"/>
<rect x="61" y="1093" width="3" height="28" rx="1.5" fill="#9bacc4"/>
<text class="label" x="79" y="1109">Postiz + Redis + Temporal + PostgreSQL (CNPG)  ·  Cloudflared</text>
<text class="note" x="60" y="978">Solid: configuration / request flow    Dashed: persistent data    Detailed readiness: GitOps → Reconciliation</text>
<text class="note" x="32" y="1200">Declared architecture, not live availability. Private access assumes no public forwarding or enabled tunnel.</text>
</svg>
