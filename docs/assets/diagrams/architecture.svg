<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1230" viewBox="0 0 1120 1230" role="img" aria-labelledby="title description">
<title id="title">Homelab · system architecture</title>
<desc id="description">Git main feeds Flux. A workstation resolves internal hostnames to the node and reaches K3s Traefik. Applications are Homepage and Linkding. Infrastructure includes Vault, External Secrets, and monitoring. Local storage serves Vault, monitoring, and Linkding. Postiz, CloudNativePG, and Cloudflared remain inactive.</desc>
