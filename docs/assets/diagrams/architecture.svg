<text class="label" x="69" y="141">Git repository</text>
<text class="body" x="69" y="169">main → gitops/clusters/lab</text>
<text class="body" x="69" y="192">Kustomize resources + Helm releases</text>
<rect x="600" y="110" width="470" height="110" rx="12" fill="#142237" stroke="#eac17a" stroke-opacity=".6"/>
