<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1060" viewBox="0 0 1020 1060" role="img" aria-labelledby="title description">
<title id="title">Secrets · bootstrap and delivery</title>
<desc id="description">Flux installs Vault and ESO. The operator initializes and unseals Vault; Terraform configures Kubernetes authentication and the KV mount. ESO uses Kubernetes identity to authenticate, reads approved values, and synchronizes monitoring Kubernetes Secrets. The monitoring release waits for readiness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7188a6"/></marker></defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.heading{font-size:29px;font-weight:700;fill:#eff5ff}.sub{font-size:18px;fill:#a8bdd7}.label{font-size:21px;font-weight:650;fill:#eff5ff}.body{font-size:18px;fill:#b8cbe2}.note{font-size:17px;fill:#9fb4d0}.tag{font-size:14px;font-weight:700;letter-spacing:1.3px}</style>
<rect width="1020" height="1060" rx="24" fill="#0b1220"/>
<text class="heading" x="32" y="48">Secrets · bootstrap and delivery</text>
<text class="sub" x="32" y="77">Git holds references. The operator owns values. External Secrets delivers them.</text>
<path d="M 510 230 V 295" fill="none" stroke="#7188a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 510 415 V 480" fill="none" stroke="#7188a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 510 590 V 655" fill="none" stroke="#7188a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 510 765 V 830" fill="none" stroke="#7188a6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="120" width="900" height="110" rx="12" fill="#142237" stroke="#7cb5ff" stroke-opacity=".6"/>
<rect x="61" y="135" width="3" height="80" rx="1.5" fill="#7cb5ff"/>
<text class="label" x="79" y="151">Installation · Flux</text>
<text class="body" x="79" y="179">Install Vault + External Secrets, then declare ClusterSecretStore and ExternalSecrets</text>
<text class="body" x="79" y="202">Running pods alone do not prove provider authentication works.</text>
<rect x="60" y="295" width="900" height="120" rx="12" fill="#142237" stroke="#eac17a" stroke-opacity=".6"/>
<rect x="61" y="310" width="3" height="90" rx="1.5" fill="#eac17a"/>
<text class="label" x="79" y="326">Configuration · operator + Terraform</text>
<text class="body" x="79" y="354">Operator: initialize, unseal, and populate monitoring credentials</text>
<text class="body" x="79" y="377">Terraform: Kubernetes auth · KV mount · policy · ESO role / audience</text>
<rect x="60" y="480" width="900" height="110" rx="12" fill="#142237" stroke="#b7a1ff" stroke-opacity=".6"/>
<rect x="61" y="495" width="3" height="80" rx="1.5" fill="#b7a1ff"/>
<text class="label" x="79" y="511">Authentication · External Secrets → Vault</text>
<text class="body" x="79" y="539">ServiceAccount: external-secrets / external-secrets · audience: vault</text>
<text class="body" x="79" y="562">Vault service: vault.vault.svc.cluster.local:8200</text>
<rect x="60" y="655" width="900" height="110" rx="12" fill="#142237" stroke="#b7a1ff" stroke-opacity=".6"/>
<rect x="61" y="670" width="3" height="80" rx="1.5" fill="#b7a1ff"/>
<text class="label" x="79" y="686">Delivery · Vault KV → Kubernetes Secrets</text>
<text class="body" x="79" y="714">monitoring/grafana → grafana-admin</text>
<text class="body" x="79" y="737">monitoring/prometheus → prometheus-basic-auth</text>
<rect x="60" y="830" width="900" height="110" rx="12" fill="#142237" stroke="#68dfcd" stroke-opacity=".6"/>
<rect x="61" y="845" width="3" height="80" rx="1.5" fill="#68dfcd"/>
<text class="label" x="79" y="861">Consumption · monitoring workloads</text>
<text class="body" x="79" y="889">Grafana admin login · Traefik Basic Auth for Prometheus</text>
<text class="body" x="79" y="912">The monitoring chart waits for the credential readiness gate.</text>
<text class="note" x="60" y="995">Homepage and Linkding reconcile independently. Inactive Postiz and Cloudflared are not on this path.</text>
<text class="note" x="60" y="1026">A Vault restart needs unsealing again. Git and Terraform do not back up application secret values.</text>
</svg>
