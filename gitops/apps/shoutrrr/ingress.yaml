apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoutrrr
spec:
  ingressClassName: traefik
  rules:
  - host: shoutrrr.homelab.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shoutrrr
            port:
              name: http
