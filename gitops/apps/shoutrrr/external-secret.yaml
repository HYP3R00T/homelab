apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shoutrrr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: shoutrrr-app
    creationPolicy: Owner
  data:
  - secretKey: APP_KEY
    remoteRef:
      key: shoutrrr
      property: app-key
  - secretKey: LINKEDIN_CLIENT_ID
    remoteRef:
      key: shoutrrr
      property: linkedin-client-id
  - secretKey: LINKEDIN_CLIENT_SECRET
    remoteRef:
      key: shoutrrr
      property: linkedin-client-secret
  - secretKey: FACEBOOK_CLIENT_ID
    remoteRef:
      key: shoutrrr
      property: facebook-client-id
  - secretKey: FACEBOOK_CLIENT_SECRET
    remoteRef:
      key: shoutrrr
      property: facebook-client-secret
