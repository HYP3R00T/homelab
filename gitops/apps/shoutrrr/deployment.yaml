apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoutrrr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shoutrrr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shoutrrr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      containers:
      - name: shoutrrr
        image: ghcr.io/coollabsio/shoutrrr:1.5.8
        # Plain cp omits the stock binary's file capabilities; keep drop: ALL.
        args:
        - /bin/sh
        - -ec
        - |
          mkdir -p /tmp/shoutrrr-bin
          cp /usr/local/bin/frankenphp /tmp/shoutrrr-bin/frankenphp
          export PATH="/tmp/shoutrrr-bin:$PATH"
          # MCP OAuth needs signing keys before the first API key is issued.
          if [ ! -e storage/oauth-private.key ] && [ ! -e storage/oauth-public.key ]; then
            php artisan passport:keys --no-interaction
          fi
          test -s storage/oauth-private.key && test -s storage/oauth-public.key
          exec supervisord -c /etc/supervisor/laravel.conf
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: shoutrrr-config
        - secretRef:
            name: shoutrrr-app
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
        - name: sqlite
          mountPath: /var/www/html/database/sqlite
        - name: runtime
          mountPath: /etc/supervisor/laravel.conf
          subPath: supervisord.conf
          readOnly: true
        startupProbe:
          httpGet:
            path: /up
            port: http
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /up
            port: http
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /up
            port: http
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: shoutrrr-storage
      - name: sqlite
        persistentVolumeClaim:
          claimName: shoutrrr-sqlite
      - name: runtime
        configMap:
          name: shoutrrr-runtime
