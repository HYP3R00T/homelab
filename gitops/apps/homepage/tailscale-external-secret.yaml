apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: homepage-tailscale
    creationPolicy: Owner
  data:
  - secretKey: HOMEPAGE_VAR_TAILSCALE_DEVICE_ID
    remoteRef:
      key: homepage/tailscale
      property: device-id
  - secretKey: HOMEPAGE_VAR_TAILSCALE_API_TOKEN
    remoteRef:
      key: homepage/tailscale
      property: api-token
