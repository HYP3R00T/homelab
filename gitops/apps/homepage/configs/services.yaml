- Applications:
    - Linkding:
        icon: linkding.png
        href: http://linkding.homelab.internal/
        namespace: linkding
        podSelector: app=linkding
        showStats: true
        target: _self
        siteMonitor: http://linkding-service.linkding.svc.cluster.local:9090
    - Shoutrrr:
        icon: https://raw.githubusercontent.com/coollabsio/shoutrrr/c0071aa2adec2311f88f744793744839ab6cb04e/public/favicon.svg
        href: https://shoutrrr.hyperoot.dev/
        namespace: shoutrrr
        podSelector: app.kubernetes.io/name=shoutrrr
        showStats: true
        target: _self
        siteMonitor: http://shoutrrr.shoutrrr.svc.cluster.local:8080/up
- Infrastructure:
    - Proxmox:
        id: infrastructure-proxmox
        icon: proxmox.png
        href: https://proxmox.tail2395c1.ts.net/
        target: _blank
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          fields: ["vms", "resources.cpu", "resources.mem"]
    - Tailscale:
        id: infrastructure-tailscale
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        target: _blank
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_API_TOKEN}}"
          fields: ["last_seen", "expires"]
    - Cloudflare Tunnel:
        id: infrastructure-cloudflared
        icon: cloudflare.png
        href: https://one.dash.cloudflare.com/
        target: _blank
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARED_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN}}"
          fields: ["status"]
    - Flux Operator:
        id: infrastructure-flux
        icon: flux-operator.png
        href: http://flux.homelab.internal/
        namespace: flux-system
        podSelector: app.kubernetes.io/name=flux-operator
        showStats: true
        target: _self
        siteMonitor: http://flux-operator.flux-system.svc.cluster.local:9080
    - Vault:
        id: infrastructure-vault
        icon: vault.png
        href: http://vault.homelab.internal/
        namespace: vault
        podSelector: app.kubernetes.io/name=vault,component=server
        showStats: true
        target: _self
        siteMonitor: http://vault.vault.svc.cluster.local:8200/v1/sys/health
    - Grafana:
        id: infrastructure-grafana
        icon: grafana.png
        href: http://grafana.homelab.internal/
        namespace: monitoring
        podSelector: app.kubernetes.io/name=grafana
        showStats: true
        target: _self
        siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
    - Prometheus:
        id: infrastructure-prometheus
        icon: prometheus.png
        href: http://prometheus.homelab.internal/
        namespace: monitoring
        podSelector: app.kubernetes.io/name=prometheus
        showStats: true
        target: _self
        siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/ready
- Web:
    - ChatGPT:
        icon: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-png@latest/dark/openai.png
        href: https://chatgpt.com/
        target: _blank
    - Gemini:
        icon: google-gemini.png
        href: https://gemini.google.com/app
        target: _blank
