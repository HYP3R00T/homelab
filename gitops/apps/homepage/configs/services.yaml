- Applications:
  - Linkding:
      icon: linkding.png
      href: http://linkding.homelab.internal/
      namespace: linkding
      podSelector: app=linkding
      showStats: true
      target: _self
      siteMonitor: http://linkding-service.linkding.svc.cluster.local:9090
  - Homepage:
      icon: homepage.png
      href: http://homepage.homelab.internal/
      namespace: homepage
      podSelector: app.kubernetes.io/name=homepage
      showStats: true
      target: _self
      siteMonitor: http://homepage.homepage.svc.cluster.local:3000
- Infrastructure & Monitoring:
  - Flux Operator:
      icon: flux-operator.png
      href: http://flux.homelab.internal/
      namespace: flux-system
      podSelector: app.kubernetes.io/name=flux-operator
      showStats: true
      target: _self
      siteMonitor: http://flux-operator.flux-system.svc.cluster.local:9080
  - Vault:
      icon: vault.png
      href: http://vault.homelab.internal/
      namespace: vault
      podSelector: app.kubernetes.io/name=vault,component=server
      showStats: true
      target: _self
      siteMonitor: http://vault.vault.svc.cluster.local:8200/v1/sys/health
  - Grafana:
      icon: grafana.png
      href: http://grafana.homelab.internal/
      namespace: monitoring
      podSelector: app.kubernetes.io/name=grafana
      showStats: true
      target: _self
      siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
  - Prometheus:
      icon: prometheus.png
      href: http://prometheus.homelab.internal/
      namespace: monitoring
      podSelector: app.kubernetes.io/name=prometheus
      showStats: true
      target: _self
      siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/ready
  - K3s Traefik:
      icon: traefik.png
      namespace: kube-system
      podSelector: app.kubernetes.io/name=traefik
      showStats: true
