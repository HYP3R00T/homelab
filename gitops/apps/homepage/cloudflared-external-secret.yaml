apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: homepage-cloudflared
    creationPolicy: Owner
  data:
  - secretKey: HOMEPAGE_VAR_CLOUDFLARED_ACCOUNT_ID
    remoteRef:
      key: homepage/cloudflared
      property: account-id
  - secretKey: HOMEPAGE_VAR_CLOUDFLARED_TUNNEL_ID
    remoteRef:
      key: homepage/cloudflared
      property: tunnel-id
  - secretKey: HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN
    remoteRef:
      key: homepage/cloudflared
      property: api-token
