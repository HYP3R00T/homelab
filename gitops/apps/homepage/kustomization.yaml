apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
- cluster-role-binding.yaml
- cluster-role.yaml
- deployment.yaml
- namespace.yaml
- service-account-token-secret.yaml
- service-account.yaml
- service.yaml
- ingress.yaml
configMapGenerator:
- name: homepage
  files:
  - configs/kubernetes.yaml
  - configs/proxmox.yaml
  - configs/settings.yaml
  - configs/bookmarks.yaml
  - configs/services.yaml
  - configs/widgets.yaml
  - configs/docker.yaml
  - configs/custom.js
  - configs/custom.css
  options:
    labels:
      app.kubernetes.io/name: homepage
