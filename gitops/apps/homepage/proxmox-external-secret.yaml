apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-proxmox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: homepage-proxmox
    creationPolicy: Owner
  data:
  - secretKey: HOMEPAGE_VAR_PROXMOX_URL
    remoteRef:
      key: homepage/proxmox
      property: url
  - secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN_ID
    remoteRef:
      key: homepage/proxmox
      property: token-id
  - secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET
    remoteRef:
      key: homepage/proxmox
      property: token-secret
