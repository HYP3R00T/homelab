apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: postiz
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/apps/postiz
  prune: true
  deletionPolicy: Orphan
  dependsOn:
  - name: cnpg
  - name: secret-store
  wait: true
