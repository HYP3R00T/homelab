apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shoutrrr
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/apps/shoutrrr
  prune: true
  dependsOn:
  - name: infrastructure
  - name: secret-store
  wait: true
