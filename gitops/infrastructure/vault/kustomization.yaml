apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault
resources:
- cluster-role-binding.yaml
- cluster-role.yaml
- helm-release.yaml
- helm-repository.yaml
- namespace.yaml
- service-account.yaml
- token-reviewer-secret.yaml
- persistent-volume-claim.yaml
configMapGenerator:
- name: vault-values
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
