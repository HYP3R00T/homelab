[project]
site_name = "Homelab"
site_description = "A private single-node Ubuntu K3s homelab managed with Flux CD."
repo_name = "HYP3R00T/homelab"
repo_url = "https://github.com/HYP3R00T/homelab"
edit_uri = "edit/main/docs/"
site_author = "Rajesh Das"
copyright = "Copyright &copy; 2026 Rajesh Das"

extra_css = ["stylesheets/extra.css"]

nav = [
  { Home = "index.md" },
  { Architecture = [
    { Overview = "architecture/index.md" },
    { Platform = "architecture/platform.md" },
    { "Traffic flow" = "architecture/traffic-flow.md" },
    { "Secrets flow" = "architecture/secrets-flow.md" },
  ] },
  { Setup = [
    { Overview = "setup/index.md" },
    { Prerequisites = "setup/prerequisites.md" },
    { K3s = "setup/k3s.md" },
    { Flux = "setup/flux.md" },
    { "Local access" = "setup/local-access.md" },
  ] },
  { GitOps = [
    { Overview = "gitops/index.md" },
    { "Repository structure" = "gitops/repository-structure.md" },
    { Reconciliation = "gitops/reconciliation.md" },
    { "Add a component" = "gitops/adding-a-service.md" },
  ] },
  { Applications = [
    { Overview = "apps/index.md" },
    { Homepage = "apps/homepage.md" },
    { Linkding = "apps/linkding.md" },
    { Shoutrrr = "apps/shoutrrr.md" },
    { Postiz = [
      { Overview = "apps/postiz/index.md" },
      { Architecture = "apps/postiz/architecture.md" },
    ] },
  ] },
  { Infrastructure = [
    { Overview = "infrastructure/index.md" },
    { Flux = "infrastructure/flux.md" },
    { Traefik = "infrastructure/traefik.md" },
    { Vault = "infrastructure/vault.md" },
    { "External Secrets" = "infrastructure/external-secrets.md" },
    { "Local Path Provisioner" = "infrastructure/local-path-provisioner.md" },
    { "Metrics Server" = "infrastructure/metrics-server.md" },
    { Monitoring = "infrastructure/kube-prometheus-stack.md" },
    { CloudNativePG = "infrastructure/cloudnative-pg.md" },
    { Cloudflared = "infrastructure/cloudflared.md" },
  ] },
  { Runbooks = [
    { Overview = "runbooks/index.md" },
    { "GitOps rollout" = "runbooks/gitops-rollout.md" },
    { "Storage recovery" = "runbooks/storage-recovery.md" },
    { "Bootstrap Vault" = "runbooks/vault-bootstrap.md" },
    { "Recover Vault" = "runbooks/vault-recovery.md" },
    { "Create Cloudflared tunnel" = "runbooks/cloudflared-tunnel.md" },
    { "Store Cloudflared credentials" = "runbooks/cloudflared-vault-credentials.md" },
  ] },
]

[project.theme]
language = "en"
favicon = "assets/branding/favicon.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.theme.icon]
logo = "lucide/laptop-minimal"
previous = "lucide/arrow-left"
next = "lucide/arrow-right"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
